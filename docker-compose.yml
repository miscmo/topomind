services:
  postgres:
    image: postgres:16-alpine
    container_name: topomind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: topomind
      POSTGRES_USER: topomind
      POSTGRES_PASSWORD: topomind
    ports:
      - "5432:5432"
    volumes:
      - topomind-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topomind -d topomind"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  topomind-postgres-data:
